<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Flappy Face</title>
<style>
  * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0f172a;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    inset: 0;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    background: linear-gradient(to bottom, #4ec0ca 0%, #a8e6cf 70%, #8fce6f 100%);
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: white;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #overlay h1 {
    font-size: 32px;
    margin-bottom: 6px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
  }
  #overlay p {
    font-size: 16px;
    opacity: 0.9;
    margin: 6px 0;
  }
  .btnRow {
    display: flex;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .gameBtn {
    touch-action: manipulation;
    padding: 12px 28px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: #f59e0b;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.1s, background 0.2s;
  }
  .gameBtn:hover {
    background: #d97706;
    transform: scale(1.05);
  }
  .gameBtn.secondary {
    background: #2563eb;
  }
  .gameBtn.secondary:hover {
    background: #1d4ed8;
  }
  #overlay input[type="text"] {
    margin-top: 14px;
    padding: 10px 14px;
    font-size: 16px;
    border-radius: 20px;
    border: none;
    outline: none;
    text-align: center;
    width: 200px;
    max-width: 80%;
  }
  #overlay .smallNote {
    font-size: 12px;
    opacity: 0.7;
    max-width: 280px;
  }
  #rankingList {
    margin-top: 12px;
    max-height: 45vh;
    overflow-y: auto;
    width: 100%;
    max-width: 320px;
  }
  .rankRow {
    display: flex;
    justify-content: space-between;
    padding: 5px 18px;
    font-size: 15px;
  }
  .rankRow.me {
    color: #f59e0b;
    font-weight: bold;
  }
  #kalanySplash {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    pointer-events: none;
  }
  #kalanySplash img {
    max-width: 62%;
    max-height: 62%;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  }
  #scoreDisplay {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  #extraLifeBanner {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 15;
    pointer-events: none;
  }
  #extraLifeBanner .gameBtn {
    pointer-events: auto;
    background: #16a34a;
    padding: 8px 18px;
    font-size: 15px;
  }
  #extraLifeBanner .gameBtn:hover { background: #15803d; }
  .nameError {
    color: #fca5a5;
    font-weight: bold;
    font-size: 14px;
  }
  .shopItem {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 12px 16px;
    margin-top: 14px;
    width: 100%;
    max-width: 320px;
    box-sizing: border-box;
    text-align: left;
  }
  .shopItem .gameBtn {
    padding: 8px 16px;
    font-size: 14px;
    white-space: nowrap;
  }
  .shopItem .gameBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="scoreDisplay">0</div>
  <div id="overlay"></div>
  <div id="extraLifeBanner" class="hidden"><button class="gameBtn" id="extraLifeBtn" data-action="useExtraLife">Usar Vida Extra</button></div>
  <div id="kalanySplash" class="hidden"><img id="kalanySplashImg" alt="Kalany"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('scoreDisplay');
const kalanySplash = document.getElementById('kalanySplash');
const extraLifeBanner = document.getElementById('extraLifeBanner');
const gameContainer = document.getElementById('gameContainer');

let W, H;

function resizeCanvas() {
  const rect = gameContainer.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = rect.width;
  H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (typeof face !== 'undefined' && face && gameState === 'ready') {
    face.x = W * 0.22;
    face.y = H / 2;
  }
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/74Gz/j/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/74mz/j/AAAAAAAAAAAAAA fahhSound.preload = 'auto';

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

function ensureAudio() {
  // Unlock audio playback on iOS/Safari by playing+pausing on first user gesture
  fahhSound.play().then(() => {
    fahhSound.pause();
    fahhSound.currentTime = 0;
  }).catch(() => {});
  try { getAudioCtx(); } catch (e) {}
}

function playDeathSound() {
  const sfx = fahhSound.cloneNode();
  sfx.volume = 1.0;
  sfx.play().catch(() => {});
}

function playFlapSound() {
  try {
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, t0);
    osc.frequency.exponentialRampToValueAtTime(540, t0 + 0.09);
    gain.gain.setValueAtTime(0.001, t0);
    gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.13);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.14);
  } catch (e) {}
}

function playPlimSound() {
  try {
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime;
    [880, 1320].forEach((freq, i) => {
      const start = t0 + i * 0.06;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.22);
    });
  } catch (e) {}
}

function triggerHatCelebration() {
  hatAnim = { active: true, startFrame: frame, duration: 40 };
  playPlimSound();
}

function resetGame() {
  face = { x: W * 0.22, y: H/2, size: Math.max(52, W * 0.16), vy: 0, rotation: 0 };
  pipes = [];
  score = 0;
  frame = 0;
  gravity = 0.42;
  flapStrength = -9.2;
  gameState = 'ready';
  hatAnim = { active: false, startFrame: 0, duration: 40 };
  scoreDisplay.textContent = '0';
  pipeSpawnTimer = -40;
  lastTime = null;
  justDied = false;
  updateExtraLifeBanner();
}

function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

function getOrCreatePlayerId() {
  let id = lsGet('flappyFacePlayerId');
  if (!id) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('p-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    lsSet('flappyFacePlayerId', id);
  }
  return id;
}

const playerId = getOrCreatePlayerId();
let playerName = lsGet('flappyFacePlayerName');
best = parseInt(lsGet('flappyFaceBest') || '0', 10) || 0;
let coins = parseInt(lsGet('flappyFaceCoins') || '0', 10) || 0;
let extraLives = parseInt(lsGet('flappyFaceExtraLives') || '0', 10) || 0;
let justDied = false;
const EXTRA_LIFE_COST = 500;

const RANKING_API = 'https://flappy-ranking.168.138.131.164.sslip.io';

let db = null;
let backend = 'local';

async function initBackend() {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const d = await window.claude.use('db');
      if (d) { db = d; backend = 'artifact'; return; }
    }
  } catch (e) {}
  backend = 'api';
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function submitScore(finalScore) {
  if (finalScore > best) {
    best = finalScore;
    lsSet('flappyFaceBest', String(best));
  }
  if (!playerName) return;
  if (backend === 'artifact' && db) {
    db.collection('ranking').doc(playerId).set({
      name: playerName,
      nameLower: playerName.toLowerCase(),
      best: best,
      updatedAt: new Date().toISOString()
    }).catch(() => {});
  } else if (backend === 'api') {
    fetch(RANKING_API + '/ranking?on_conflict=player_id', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ player_id: playerId, name: playerName, best: best, updated_at: new Date().toISOString() })
    }).catch(() => {});
  }
}

async function isNameTaken(name) {
  const lower = name.toLowerCase();
  try {
    if (backend === 'artifact' && db) {
      const snap = await db.collection('ranking').where('nameLower', '==', lower).limit(5).get();
      return snap.docs.some(d => d.id !== playerId);
    } else if (backend === 'api') {
      const res = await fetch(RANKING_API + '/ranking?name=ilike.' + encodeURIComponent(name) + '&select=player_id');
      if (!res.ok) return false;
      const rows = await res.json();
      return rows.some(r => r.player_id !== playerId);
    }
  } catch (e) {}
  return false;
}

function flap() {
  try { ensureAudio(); } catch (e) {}
  face.vy = flapStrength;
  playFlapSound();
}

let menuReturnState = 'ready';
let nameError = '';

function renderOverlay() {
  if (gameState === 'playing' || gameState === 'splash') {
    overlay.classList.add('hidden');
    return;
  }
  overlay.classList.remove('hidden');
  if (gameState === 'name') {
    overlay.innerHTML = `
      <h1>Flappy Face</h1>
      <p>Antes de começar, qual é o seu nome?</p>
      <input type="text" id="nameInput" maxlength="16" placeholder="Seu nome" autocomplete="off">
      ${nameError ? `<p class="nameError">${escapeHtml(nameError)}</p>` : ''}
      <div class="btnRow">
        <button class="gameBtn" data-action="confirmName">Confirmar</button>
      </div>
      <p class="smallNote">Não dá pra mudar depois (só limpando os dados do site nesse aparelho).</p>
    `;
    const input = document.getElementById('nameInput');
    if (input) setTimeout(() => input.focus(), 0);
  } else if (gameState === 'ready') {
    overlay.innerHTML = `
      <h1>Flappy Face</h1>
      <p>Olá, ${escapeHtml(playerName || '')}!</p>
      <p>Toque ou aperte espaço para voar</p>
      <p>Desvie dos canos!</p>
      <p>Moedas: ${coins}</p>
      <div class="btnRow">
        <button class="gameBtn" data-action="play">Jogar</button>
        <button class="gameBtn secondary" data-action="ranking">Ranking</button>
        <button class="gameBtn secondary" data-action="shop">Loja</button>
      </div>
    `;
  } else if (gameState === 'over') {
    overlay.innerHTML = `
      <h1>Fim de jogo!</h1>
      <p>Pontuação: ${score}</p>
      <p>Seu recorde: ${best}</p>
      <p>Moedas: ${coins}</p>
      <div class="btnRow">
        <button class="gameBtn" data-action="play">Jogar novamente</button>
        <button class="gameBtn secondary" data-action="ranking">Ranking</button>
        <button class="gameBtn secondary" data-action="shop">Loja</button>
      </div>
    `;
  } else if (gameState === 'ranking') {
    overlay.innerHTML = `
      <h1>Ranking</h1>
      <div id="rankingList">Carregando...</div>
      <div class="btnRow">
        <button class="gameBtn secondary" data-action="closeMenu">Voltar</button>
      </div>
    `;
    loadRanking();
  } else if (gameState === 'shop') {
    overlay.innerHTML = `
      <h1>Loja</h1>
      <p>Moedas: ${coins}</p>
      <div class="shopItem">
        <div>
          <strong>Vida Extra</strong>
          <p class="smallNote">Ao morrer, continue com a mesma pontuação (cenário reinicia). Você tem: ${extraLives}</p>
        </div>
        <button class="gameBtn" data-action="buyExtraLife" ${coins < EXTRA_LIFE_COST ? 'disabled' : ''}>Comprar (${EXTRA_LIFE_COST})</button>
      </div>
      <div class="btnRow">
        <button class="gameBtn secondary" data-action="closeMenu">Voltar</button>
      </div>
    `;
  }
}

async function confirmName() {
  const input = document.getElementById('nameInput');
  if (!input) return;
  const name = input.value.trim().slice(0, 16);
  if (!name) { input.focus(); return; }
  const btn = overlay.querySelector('[data-action="confirmName"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Verificando...'; }
  const taken = await isNameTaken(name);
  if (taken) {
    nameError = 'Esse nome já está em uso. Escolha outro.';
    renderOverlay();
    const retryInput = document.getElementById('nameInput');
    if (retryInput) retryInput.value = name;
    return;
  }
  nameError = '';
  playerName = name;
  lsSet('flappyFacePlayerName', name);
  submitScore(best);
  gameState = 'ready';
  renderOverlay();
}

function showKalanySplash(onDone) {
  gameState = 'splash';
  overlay.classList.add('hidden');
  kalanySplash.classList.remove('hidden');
  setTimeout(() => {
    kalanySplash.classList.add('hidden');
    onDone();
  }, 2000);
}

function handlePlayClick() {
  try { ensureAudio(); } catch (e) {}
  if (gameState === 'over') resetGame();
  showKalanySplash(() => {
    gameState = 'playing';
    overlay.classList.add('hidden');
  });
}

function continueWithExtraLife() {
  if (extraLives < 1) return;
  extraLives -= 1;
  lsSet('flappyFaceExtraLives', String(extraLives));
  const savedScore = score;
  try { ensureAudio(); } catch (e) {}
  resetGame();
  score = savedScore;
  scoreDisplay.textContent = String(score);
  showKalanySplash(() => {
    gameState = 'playing';
    overlay.classList.add('hidden');
  });
}

function buyExtraLife() {
  if (coins < EXTRA_LIFE_COST) return;
  coins -= EXTRA_LIFE_COST;
  extraLives += 1;
  lsSet('flappyFaceCoins', String(coins));
  lsSet('flappyFaceExtraLives', String(extraLives));
  renderOverlay();
  updateExtraLifeBanner();
}

function openRanking() {
  menuReturnState = gameState;
  gameState = 'ranking';
  renderOverlay();
}

function openShop() {
  menuReturnState = gameState;
  gameState = 'shop';
  renderOverlay();
}

function closeMenu() {
  gameState = menuReturnState;
  renderOverlay();
}

function updateExtraLifeBanner() {
  if (justDied && extraLives >= 1) {
    const btn = document.getElementById('extraLifeBtn');
    if (btn) btn.textContent = `Usar Vida Extra (${extraLives})`;
    extraLifeBanner.classList.remove('hidden');
  } else {
    extraLifeBanner.classList.add('hidden');
  }
}

async function loadRanking() {
  const el = document.getElementById('rankingList');
  if (backend === 'artifact' && db) {
    try {
      const snap = await db.collection('ranking').orderBy('best', 'desc').limit(10).get();
      const el2 = document.getElementById('rankingList');
      if (!el2) return;
      if (snap.empty) {
        el2.textContent = 'Ninguém pontuou ainda!';
        return;
      }
      el2.innerHTML = snap.docs.map((d, i) => {
        const data = d.data() || {};
        const name = escapeHtml(String(data.name || '???')).slice(0, 32);
        const scoreVal = Number(data.best) || 0;
        const mine = d.id === playerId ? ' me' : '';
        return `<div class="rankRow${mine}"><span>${i + 1}. ${name}</span><span>${scoreVal}</span></div>`;
      }).join('');
    } catch (e) {
      const el2 = document.getElementById('rankingList');
      if (el2) el2.textContent = 'Erro ao carregar ranking.';
    }
    return;
  }
  if (backend !== 'api') {
    if (el) el.textContent = 'Ranking indisponível. Seu recorde: ' + best;
    return;
  }
  try {
    const res = await fetch(RANKING_API + '/ranking?select=player_id,name,best&order=best.desc&limit=10');
    if (!res.ok) throw new Error('bad status');
    const rows = await res.json();
    const el2 = document.getElementById('rankingList');
    if (!el2) return;
    if (!rows.length) {
      el2.textContent = 'Ninguém pontuou ainda!';
      return;
    }
    el2.innerHTML = rows.map((row, i) => {
      const name = escapeHtml(String(row.name || '???')).slice(0, 32);
      const scoreVal = Number(row.best) || 0;
      const mine = row.player_id === playerId ? ' me' : '';
      return `<div class="rankRow${mine}"><span>${i + 1}. ${name}</span><span>${scoreVal}</span></div>`;
    }).join('');
  } catch (e) {
    const el2 = document.getElementById('rankingList');
    if (el2) el2.textContent = 'Erro ao carregar ranking.';
  }
}

function addPipe() {
  const gap = Math.max(150, H * 0.24);
  const minTop = 60;
  const maxTop = H - gap - 120;
  const topHeight = Math.random() * (maxTop - minTop) + minTop;
  const pw = Math.max(50, W * 0.15);
  pipes.push({ x: W + 30, top: topHeight, gap: gap, width: pw, passed: false });
}

function update(dtScale) {
  if (gameState !== 'playing') return;
  frame += dtScale;

  face.vy += gravity * dtScale;
  face.y += face.vy * dtScale;
  face.rotation = Math.max(-25, Math.min(70, face.vy * 4));

  pipeSpawnTimer += dtScale;
  if (pipeSpawnTimer >= 95) {
    pipeSpawnTimer -= 95;
    addPipe();
  }

  const speed = Math.max(2.2, W * 0.0065);
  pipes.forEach(p => p.x -= speed * dtScale);
  pipes = pipes.filter(p => p.x + p.width > -10);

  pipes.forEach(p => {
    if (!p.passed && p.x + p.width < face.x - face.size/2) {
      p.passed = true;
      score++;
      coins++;
      lsSet('flappyFaceCoins', String(coins));
      scoreDisplay.textContent = score;
      triggerHatCelebration();
    }
  });

  // collisions (hitbox menor que o sprite para colisão mais justa/generosa)
  const r = face.size/2 - 12;
  if (face.y + r > H - 20 || face.y - r < 0) {
    gameOver();
  }
  pipes.forEach(p => {
    const withinX = face.x + r > p.x && face.x - r < p.x + p.width;
    if (withinX) {
      const withinGapTop = face.y - r < p.top;
      const withinGapBottom = face.y + r > p.top + p.gap;
      if (withinGapTop || withinGapBottom) {
        gameOver();
      }
    }
  });
}

function gameOver() {
  if (gameState === 'over') return;
  gameState = 'over';
  justDied = true;
  playDeathSound();
  submitScore(score);
  renderOverlay();
  updateExtraLifeBanner();
}

function drawBackground() {
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 3; i++) {
    const cx = ((frame * 0.3) + i * 160) % (W + 100) - 50;
    ctx.beginPath();
    ctx.ellipse(cx, 80 + i * 40, 30, 16, 0, 0, Math.PI*2);
    ctx.ellipse(cx + 20, 75 + i * 40, 22, 14, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // ground
  ctx.fillStyle = '#8b6f47';
  ctx.fillRect(0, H - 20, W, 20);
  ctx.fillStyle = '#6b5335';
  for (let i = 0; i < W; i += 20) {
    ctx.fillRect((i - (frame*2.6 % 20)), H - 20, 10, 6);
  }
}

function drawPipes() {
  pipes.forEach(p => {
    ctx.fillStyle = '#3fae4f';
    ctx.strokeStyle = '#2c7d38';
    ctx.lineWidth = 3;
    // top pipe
    ctx.fillRect(p.x, 0, p.width, p.top);
    ctx.strokeRect(p.x, 0, p.width, p.top);
    ctx.fillRect(p.x - 5, p.top - 24, p.width + 10, 24);
    ctx.strokeRect(p.x - 5, p.top - 24, p.width + 10, 24);
    // bottom pipe
    const bottomY = p.top + p.gap;
    ctx.fillRect(p.x, bottomY, p.width, H - bottomY - 20);
    ctx.strokeRect(p.x, bottomY, p.width, H - bottomY - 20);
    ctx.fillRect(p.x - 5, bottomY, p.width + 10, 24);
    ctx.strokeRect(p.x - 5, bottomY, p.width + 10, 24);
  });
}

function drawCowboyHat(cx, cy, scale, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  // brim (wide oval)
  ctx.fillStyle = '#8b5a2b';
  ctx.strokeStyle = '#5c3a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 6, 34, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // crown (rounded top, pinched sides)
  ctx.fillStyle = '#a56a35';
  ctx.beginPath();
  ctx.moveTo(-15, 6);
  ctx.quadraticCurveTo(-18, -22, 0, -26);
  ctx.quadraticCurveTo(18, -22, 15, 6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // pinch dent on top
  ctx.strokeStyle = '#5c3a1a';
  ctx.beginPath();
  ctx.moveTo(-6, -20);
  ctx.quadraticCurveTo(0, -14, 6, -20);
  ctx.stroke();

  // hat band
  ctx.fillStyle = '#4a2f18';
  ctx.fillRect(-15, 1, 30, 6);

  ctx.restore();
}

function drawFace() {
  ctx.save();
  ctx.translate(face.x, face.y);
  ctx.rotate(face.rotation * Math.PI / 180);
  const s = face.size;
  ctx.beginPath();
  ctx.arc(0, 0, s/2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.save();
  ctx.clip();
  if (faceImg.complete && faceImg.naturalWidth > 0) {
    ctx.drawImage(faceImg, -s/2, -s/2, s, s);
  } else {
    ctx.fillStyle = '#f5b942';
    ctx.fill();
  }
  ctx.restore();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  ctx.restore();

  if (hatAnim.active) {
    const t = (frame - hatAnim.startFrame) / hatAnim.duration;
    if (t >= 1) {
      hatAnim.active = false;
    } else {
      const bounce = Math.sin(Math.min(t * 1.6, 1) * Math.PI / 2);
      const scale = (face.size / 90) * (0.7 + 0.5 * bounce);
      const liftY = -face.size/2 - 14 - bounce * 22;
      const alpha = t < 0.75 ? 1 : 1 - (t - 0.75) / 0.25;
      drawCowboyHat(face.x, face.y + liftY, scale, alpha);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawPipes();
  drawFace();
}

function loop(now) {
  try {
    if (lastTime === null) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (!isFinite(dt) || dt <= 0) dt = 16.6667;
    dt = Math.min(dt, 50); // evita saltos grandes ao voltar de aba/tela em segundo plano
    const dtScale = dt / 16.6667; // 1.0 equivale a 60fps; normaliza para 90Hz/120Hz

    update(dtScale);
    draw();
  } catch (err) {
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.font = '14px Arial';
    ctx.fillText('Erro: ' + err.message, 10, 30);
    ctx.restore();
  }
  requestAnimationFrame(loop);
}

canvas.addEventListener('pointerdown', (e) => {
  if (gameState === 'playing') { e.preventDefault(); flap(); }
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && gameState === 'playing') { e.preventDefault(); flap(); }
});

overlay.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn || btn.disabled) return;
  e.preventDefault();
  const action = btn.dataset.action;
  if (action === 'confirmName') confirmName();
  else if (action === 'play') handlePlayClick();
  else if (action === 'ranking') openRanking();
  else if (action === 'shop') openShop();
  else if (action === 'closeMenu') closeMenu();
  else if (action === 'buyExtraLife') buyExtraLife();
});
overlay.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && gameState === 'name') confirmName();
});

extraLifeBanner.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action="useExtraLife"]');
  if (!btn) return;
  e.preventDefault();
  continueWithExtraLife();
});

function initGame() {
  try {
    resizeCanvas();
    resetGame();
    const splashImg = document.getElementById('kalanySplashImg');
    if (splashImg) splashImg.src = kalanyImg.src;
    if (!playerName) gameState = 'name';
    renderOverlay();
    initBackend();
    requestAnimationFrame(loop);
  } catch (err) {
    ctx.fillStyle = '#fff';
    ctx.font = '14px Arial';
    ctx.fillText('Erro ao iniciar: ' + err.message, 10, 30);
  }
}

if (document.readyState === 'complete') {
  initGame();
} else {
  window.addEventListener('load', initGame);
}
